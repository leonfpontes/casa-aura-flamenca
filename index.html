<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4a0710" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="geo.region" content="BR-SP" />
    <meta name="geo.placename" content="Ribeirão Preto" />
    <meta name="geo.position" content="-21.183884;-47.812548" />
    <meta name="ICBM" content="-21.183884, -47.812548" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      SEO por idioma: o build (scripts/prerender.mjs) troca este bloco pelas tags
      geradas em src/lib/seo/seo.ts — title, description, canonical, hreflang,
      Open Graph/Twitter e dados estruturados (schema.org). Em dev vale o padrão abaixo.
    -->
    <!--seo:start-->
    <title>Aulas de Flamenco em Ribeirão Preto | Casa Aura Flamenca</title>
    <meta name="description" content="Escola de flamenco desde 2012 em Ribeirão Preto, com Carol Robatini." />
    <!--seo:end-->

    <!-- Fontes do primeiro quadro: pré-carregadas para não "pular" o layout -->
    <link rel="preload" href="/fonts/marcellus.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Tema e modo de movimento aplicados antes do primeiro paint (sem "flash") -->
    <script>
      try {
        var h = document.documentElement;
        var t = localStorage.getItem('aura:theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) h.classList.add('dark');
        var m = localStorage.getItem('aura:motion') || 'system';
        var os = matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (os) h.classList.add('os-reduced-motion');
        if (m === 'reduced' || (m === 'system' && os)) h.classList.add('reduced-motion');
      } catch (e) {}
    </script>

    <!--
      Google Analytics 4 — adiado e opcional. Preencha GA_ID com o ID da
      propriedade da casa (G-XXXXXXX). Vazio = sem GA (o site usa o NoopTracker).
      A fila (dataLayer/gtag) existe desde já, então nenhum evento se perde; o
      script só baixa com a página ociosa.
    -->
    <script>
      var GA_ID = '';
      if (GA_ID) {
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', GA_ID);
        addEventListener('load', function () {
          var load = function () {
            var s = document.createElement('script');
            s.async = true;
            s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
            document.head.appendChild(s);
          };
          'requestIdleCallback' in window ? requestIdleCallback(load, { timeout: 4000 }) : setTimeout(load, 2500);
        });
      }
    </script>
  </head>
  <body>
    <noscript>Este site precisa de JavaScript. Contato: (16) 98247-0203 · casaauraflamenca@gmail.com</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
